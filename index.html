#boot strong{font-size:24px;line-height:1}
#boot small{color:#a9b7cc;font-size:12px}
@keyframes sp{to{transform:rotate(360deg)}}
#fatal{position:fixed;inset:0;display:none;padding:24px;background:#0f172a;color:#fca5a5;

  .m-root::after {
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; user-select:none;
    background:radial-gradient(700px 430px at 50% 4%,rgba(59,130,246,.13),transparent 70%),linear-gradient(90deg,rgba(5,7,19,.42),transparent 24%,transparent 76%,rgba(5,7,19,.42));
  }
  .m-root * { box-sizing:border-box; }
  .m-root button,.m-root input { font:inherit; }
  .m-root button { min-height:48px; touch-action:manipulation; cursor:pointer; transition:transform .13s ease,background-color .16s ease,border-color .16s ease,box-shadow .16s ease; }
  .m-root button:active:not(:disabled) { transform:translateY(2px) scale(.985); }
  .m-root button:focus-visible,.m-root input:focus-visible { outline:3px solid #7dd3fc; outline-offset:3px; }
  .m-root button:disabled { cursor:not-allowed; color:#8190a8; background:#182238; border-color:rgba(148,163,184,.14); box-shadow:none; }
  .m-screen,.m-home,.m-result { width:min(100%,900px); margin:0 auto; animation:m-screen-in .24s ease-out both; }

<script>
(function () {
  // Service worker: the whole game is one 500 KB document, so caching it once
  // is the entire offline story. Registered after load so it never competes
  // with the game's own boot.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline install is a bonus, not a requirement */ });
    });
  }

  var banner = document.getElementById('pwa-install');
  var addBtn = document.getElementById('pwa-add');
  var closeBtn = document.getElementById('pwa-close');
  var DISMISS_KEY = 'maydan.install.dismissed';

  function installed() {
    try {

             window.matchMedia('(display-mode: fullscreen)').matches ||
             navigator.standalone === true;
    } catch (e) { return false; }
  }
  function dismissed() {
    try { return localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
  }
  function dismiss() {
    banner.classList.remove('show');
    try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
  }
  closeBtn.addEventListener('click', dismiss);

  if (installed() || dismissed()) return;

  var deferred = null;

  // Android / Chromium: a real install prompt is available.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    setTimeout(function () { if (!installed() && !dismissed()) banner.classList.add('show'); }, 2600);
  });

  addBtn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; dismiss(); });
  });

  // iOS Safari fires no install event, so the banner explains the manual route
  // instead of offering a button that cannot do anything.
  var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    setTimeout(function () { if (!installed() && !dismissed()) banner.classList.add('show'); }, 3200);
  }

  window.addEventListener('appinstalled', dismiss);
})();
</script>
