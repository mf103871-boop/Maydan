name: Validate release candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs (the tag is kept in the comment for readability):
# a moved tag cannot change what runs against the repository's secrets and artifacts.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Advisory only here: a transient advisory in a dev dependency must not block a
      # release candidate. The weekly `audit.yml` run fails loudly on the same command.
      - run: npm audit --audit-level=moderate
        continue-on-error: true
      - run: npm run build:cloudflare
      - run: npm test
      # The shipped cues and music must match their manifests and the committed masters.
      - run: npm run audio:check
      - run: npm run bank:validate
      - run: npm run ios:prepare

  # Real browser against the built document: startup, every game's setup screen, the
  # service worker's navigation handling and the startup image cache. These scripts
  # existed for a year without ever running in CI.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:cloudflare
      - name: Service worker navigation (Chromium)
        run: npm run e2e:sw
      - name: UI smoke over the built document
        run: |
          node scripts/dev.mjs --serve-only &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          E2E_BASE_URL=http://localhost:3000 node scripts/e2e/smoke.mjs "$RUNNER_TEMP/e2e/smoke"
      - name: Startup images are cached and served offline
        run: node scripts/e2e/startup-images.mjs "$RUNNER_TEMP/e2e/startup-images"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: e2e-evidence
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7
