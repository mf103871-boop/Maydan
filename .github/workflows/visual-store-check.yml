name: Inspect small-screen store geometry
on:
  push:
    branches: [codex/testflight-visual-v4-store320-check]
permissions:
  contents: read
jobs:
  preview-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the isolated preview from the hosted runner
        run: |
          node --input-type=module <<'JS'
          const origin = 'https://maydan-mafia-preview.mf103871.workers.dev';
          for (const path of ['/health', '/api/cosmetics/catalog', '/api/billing/config', '/api/legal/status']) {
            const response = await fetch(origin + path, {headers: {Origin:'maydan://app'}, signal: AbortSignal.timeout(18000)});
            console.log(JSON.stringify({path, status:response.status, region:response.headers.get('cf-ray')?.split('-').pop()}));
            if (!response.ok) process.exitCode = 1;
          }
          JS
  store:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium webkit
      - run: node --test tests/plus-store-v2-browser.test.js
