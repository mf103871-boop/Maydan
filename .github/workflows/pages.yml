name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]

# The site is one deploy of one branch: let a running deploy finish rather than
# cancelling it, or a half-uploaded artifact becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: configure pages
        uses: actions/configure-pages@v5
      - name: install
        run: npm ci --no-audit --no-fund
      - name: test
        run: npm test
      - name: build
        # dist/ is the site: the single-file game plus the PWA files from public/.
        run: npm run build
      - name: upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
