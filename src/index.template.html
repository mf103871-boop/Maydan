<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E7">
<meta name="description" content="ميدان: ألعاب جمعتنا — تحديات معلومات وسرعة وتمثيل، وغرف مين فينا ليلعب الأصدقاء والعائلة من هواتفهم.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميدان">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="ميدان: ألعاب جمعتنا">
<meta name="version" content="<!--VERSION-->">
<title>ميدان: ألعاب جمعتنا</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<!--PRELOAD-->
<style>
<!--TOKENS_CSS-->
#boot{min-height:100dvh;display:grid;align-content:center;justify-items:center;gap:16px;color:#35213d;background:#fff5e6;text-align:center}
#boot .mark{display:grid;place-items:center;width:88px;height:88px;border-radius:20px;background:linear-gradient(135deg,#ffdfbf,#fce3c9)}
#boot .name{font-size:27px;font-weight:900;margin:0}
#boot .track{width:min(75%,300px);height:12px;overflow:hidden;border-radius:99px;background:#e4d2e8}
#boot .track::after{content:"";display:block;width:34%;height:100%;border-radius:inherit;background:#087d89;animation:boot-load 1.2s ease-in-out infinite alternate}
@keyframes boot-load{to{transform:translateX(-190%)}}
@media (prefers-reduced-motion:reduce){#boot .track::after{animation:none}}
#fatal{position:fixed;inset:0;display:none;padding:24px;background:#FFFCF4;color:#A52C37;font-size:14px;line-height:2;overflow:auto;z-index:9999}
#fatal pre{margin:0 0 18px;font:inherit;white-space:pre-wrap;word-break:break-word}
#fatal .acts{display:grid;gap:10px;max-width:420px}
#fatal button{min-height:52px;padding:0 16px;border-radius:18px;border:1px solid #CFB599;background:#FFFEF8;color:#352547;font:inherit;font-weight:800;cursor:pointer}
#fatal button.danger{border-color:#EDB1AA;background:#FCE9E3;color:#A42F32}
</style>
</head>
<body>
<div id="root"><div id="boot" role="status" aria-live="polite"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="58" height="58" fill="none" stroke="#422a37" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path fill="#f9cf55" d="M12 4.5a5.4 5.4 0 0 0-3.4 9.6c.9.7 1.4 1.6 1.4 2.9h4c0-1.3.5-2.2 1.4-2.9A5.4 5.4 0 0 0 12 4.5Z"/><path fill="#ad7863" d="M10 17h4v2.5h-4z"/><path d="M11 21h2M12 1v1M4.5 3.5l1 1M2 9h2m16 0h2m-3.5-5.5-1 1M4 15l1.4-.8m14.6.8-1.4-.8"/></svg></span><p class="name">جارٍ تجهيز ميدان</p><span class="track" aria-hidden="true"></span></div></div>
<noscript>تحتاج ميدان إلى تفعيل JavaScript في المتصفح لتشغيل الألعاب.</noscript>
<div id="fatal" role="alert">
<pre id="fatal-detail"></pre>
<div class="acts">
<button type="button" id="fatal-reload">إعادة المحاولة</button>
<button type="button" id="fatal-home">العودة إلى الرئيسية</button>
<button type="button" id="fatal-clear" class="danger">مسح البيانات وإعادة التشغيل</button>
</div>
</div>
<script>
// حارس مرحلة الإقلاع فقط: يلتقط حزمة لا تُحلَّل أو لا تعمل قبل تركيب React.
// بعد نجاح التركيب يستبدله main.jsx، فلا يغطي خطأٌ عابر (معالج نقر، تنبيه
// ResizeObserver) لعبةً تعمل بلوحة عطل ملء الشاشة.
window.onerror = function (msg, src, line, col) {
  if (window.__maydanBooted) return false;
  if (/ResizeObserver loop/.test(String(msg))) return false;
  var f = document.getElementById('fatal');
  var d = document.getElementById('fatal-detail');
  if (f) { f.style.display = 'block'; if (d) { d.textContent = 'خطأ في تشغيل المنصة:\n' + msg + '\nسطر ' + line + ':' + col; } }
  return false;
};
// لوحة العطل لم يكن فيها مخرج: هذه الأزرار تعيد المحاولة أو تمسح البيانات
// المعطوبة، فلا يبقى اللاعب أمام شاشة ميتة في كل فتح.
(function () {
  function on(id, fn) { var el = document.getElementById(id); if (el) { el.addEventListener('click', fn); } }
  function home() { location.hash = '#/'; location.reload(); }
  on('fatal-reload', function () { location.reload(); });
  on('fatal-home', home);
  on('fatal-clear', function () {
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && (k.indexOf('maydan:') === 0 || k.indexOf('maydan-') === 0)) { localStorage.removeItem(k); }
      }
    } catch (e) { /* ignore */ }
    home();
  });
})();
</script>
<script>
<!--BUNDLE_JS-->
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // An update is used on the next normal launch, never by interrupting a round.
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
