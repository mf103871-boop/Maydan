<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E7">
<meta name="description" content="ميدان: ألعاب جمعتنا — تحديات معلومات وسرعة وتمثيل، وغرف مين فينا ليلعب الأصدقاء والعائلة من هواتفهم.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميدان">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="ميدان: ألعاب جمعتنا">
<meta name="version" content="<!--VERSION-->">
<title>ميدان: ألعاب جمعتنا</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
<!--TOKENS_CSS-->
#boot{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#087D89;background:radial-gradient(520px 340px at 50% 38%,#F0E0F7 0%,#FFF7E7 48%,#FFF7E7 100%)}
#boot .mark{width:112px;height:112px;display:block;object-fit:cover;border:0;border-radius:30px;background:#FFF7E7;box-shadow:inset 0 2px 0 #FFFFFF66,0 5px 0 #6A3A8A,0 14px 30px rgba(91,61,36,.18);animation:boot-in .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes boot-in{from{opacity:0;transform:translateY(8px) scale(.94)}}
@media (prefers-reduced-motion: reduce){#boot .mark,#boot .ring{animation:none}}
#boot .name{font-size:24px;font-weight:900;margin:0}
#boot .ring{width:28px;height:28px;border:3px solid rgba(245,184,46,.2);border-top-color:#087D89;border-radius:50%;animation:boot-spin .85s linear infinite}
#boot small{color:#77677C;font-size:13px}
@keyframes boot-spin{to{transform:rotate(360deg)}}
#fatal{position:fixed;inset:0;display:none;padding:24px;background:#FFFCF4;color:#A52C37;font-size:14px;line-height:2;overflow:auto;z-index:9999}
#fatal pre{margin:0 0 18px;font:inherit;white-space:pre-wrap;word-break:break-word}
#fatal .acts{display:grid;gap:10px;max-width:420px}
#fatal button{min-height:52px;padding:0 16px;border-radius:18px;border:1px solid #CFB599;background:#FFFEF8;color:#352547;font:inherit;font-weight:800;cursor:pointer}
#fatal button.danger{border-color:#EDB1AA;background:#FCE9E3;color:#A42F32}
</style>
</head>
<body>
<div id="root"><div id="boot" role="status" aria-live="polite" aria-label="جارٍ تجهيز ميدان"><img class="mark" src="icons/icon-192.png" width="112" height="112" alt=""><p class="name">ميدان</p><small>ألعاب جمعتنا</small><div class="ring" aria-hidden="true"></div><small>تجهز الساحة…</small></div></div>
<noscript>تحتاج ميدان إلى تفعيل JavaScript في المتصفح لتشغيل الألعاب.</noscript>
<div id="fatal" role="alert">
<pre id="fatal-detail"></pre>
<div class="acts">
<button type="button" id="fatal-reload">إعادة المحاولة</button>
<button type="button" id="fatal-home">العودة إلى الرئيسية</button>
<button type="button" id="fatal-clear" class="danger">مسح البيانات وإعادة التشغيل</button>
</div>
</div>
<script>
window.onerror = function (msg, src, line, col) {
  var f = document.getElementById('fatal');
  var d = document.getElementById('fatal-detail');
  if (f) { f.style.display = 'block'; if (d) { d.textContent = 'خطأ في تشغيل المنصة:\n' + msg + '\nسطر ' + line + ':' + col; } }
};
// لوحة العطل لم يكن فيها مخرج: هذه الأزرار تعيد المحاولة أو تمسح البيانات
// المعطوبة، فلا يبقى اللاعب أمام شاشة ميتة في كل فتح.
(function () {
  function on(id, fn) { var el = document.getElementById(id); if (el) { el.addEventListener('click', fn); } }
  function home() { location.hash = '#/'; location.reload(); }
  on('fatal-reload', function () { location.reload(); });
  on('fatal-home', home);
  on('fatal-clear', function () {
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && (k.indexOf('maydan:') === 0 || k.indexOf('maydan-') === 0)) { localStorage.removeItem(k); }
      }
    } catch (e) { /* ignore */ }
    home();
  });
})();
</script>
<script>
<!--BUNDLE_JS-->
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // An update is used on the next normal launch, never by interrupting a round.
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
