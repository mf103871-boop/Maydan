<style>
<!--TOKENS_CSS-->
<!--OPENING_FONTS-->
body{margin:0}
#boot{background:#fff8f0;color:#352139}
#root[hidden],#boot[hidden],#fatal[hidden]{display:none!important}
#root[data-opening-covered]{isolation:isolate;pointer-events:none}
#fatal,.maydan-no-script{position:fixed;inset:0;z-index:9999;overflow:auto;box-sizing:border-box;padding:clamp(16px,5vw,40px);background:#fff8f0;color:#352139;font:400 16px/1.55 'Maydan Opening',system-ui,sans-serif}
.opening-card{box-sizing:border-box;max-width:420px;margin:clamp(0px,5vh,48px) auto;padding:clamp(16px,5vw,28px);text-align:center;background:#fffdf9;border:1px solid #e7d9cf;border-radius:24px;box-shadow:0 12px 36px #795d4314}
.opening-card .opening-recovery-art{display:block;object-fit:contain;width:clamp(84px,16vh,140px);height:clamp(72px,14vh,120px);margin:12px auto}.opening-card>b{font-size:24px}.opening-card h1{font-size:26px;line-height:1.35;margin:8px 0}.opening-card p{margin:0 0 12px}.opening-card button,.opening-card summary{min-height:48px;font:inherit;font-weight:700;cursor:pointer}
.opening-card button{border:1px solid #503c55;border-radius:16px;background:#fffdf9;color:inherit;padding:8px 16px;width:100%;margin:4px 0}.opening-card button:first-child{background:#08796d;color:white;border-color:#08796d}.opening-card .danger{color:#9f323d;border-color:#9f323d}
.opening-card small{display:block;font-size:14px;margin:12px 0 4px}.opening-card details{margin-top:8px}.opening-card summary{align-content:center}.opening-card pre{white-space:pre-wrap;overflow-wrap:anywhere;text-align:start;font:400 14px/1.5 system-ui}
</style>
<link rel="stylesheet" href="./opening/studio.css">
<link rel="preload" as="image" href="./opening/maydan-bulb.webp">
</head>
<body>
<div id="root"></div>
  <div id="boot" data-phase="checking"><main class="opening-studio">
    <div class="opening-brand" aria-hidden="true"><span data-ar="ميدان" data-en="Maydan">ميدان</span><i></i></div>
    <div class="opening-scene" aria-hidden="true">
      <div class="opening-bloom"></div>
      <div class="opening-plinth-shade"></div><div class="opening-plinth"><div class="opening-rim"></div></div>
      <div class="opening-contact-shadow"></div><div id="opening-ripple"></div>
      <canvas id="opening-orbit-back"></canvas>
      <div class="opening-lamp-mount"><div class="opening-lamp-float"><img id="opening-lamp" src="./opening/maydan-bulb.webp" width="600" height="600" alt="" draggable="false" fetchpriority="high"><i id="opening-glint"></i></div></div>
      <canvas id="opening-orbit-front"></canvas>
    </div>
    <section class="opening-readout" aria-labelledby="opening-title">
      <h1 class="opening-title" id="opening-title" data-ar="جارٍ تجهيز ميدان" data-en="Opening Maydan">جارٍ تجهيز ميدان</h1>
      <div id="opening-meter">
        <div class="opening-readout-top"><span class="opening-status"><i></i><span id="opening-state" data-ar="فحص ملفات اللعبة" data-en="Checking game files">فحص ملفات اللعبة</span></span><bdi id="opening-pct" dir="ltr">—</bdi></div>
        <div id="opening-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="opening-title"><div id="opening-fill"><div></div></div></div>
        <div class="opening-amounts"><span id="opening-files"></span><bdi dir="ltr" id="opening-bytes"></bdi></div>
      </div>
      <div id="opening-failure" hidden><p id="opening-reason"></p><button id="opening-retry" type="button" data-ar="إعادة المحاولة" data-en="Try again">إعادة المحاولة</button><details class="opening-details"><summary class="opening-summary" data-ar="تفاصيل الخطأ" data-en="Error details">تفاصيل الخطأ</summary><p id="opening-detail" dir="auto"></p></details></div>
    </section>
    <p class="opening-sr" id="opening-announce" role="status" aria-live="polite" aria-atomic="true"></p>
  </main></div>
<noscript><style>#boot,#root{display:none!important}</style><main class="maydan-no-script"><section class="opening-card"><b>ميدان · Maydan</b><!--OPENING_RECOVERY_ART--><h1>JavaScript غير مفعّل</h1><p lang="ar" dir="rtl">لتشغيل ميدان، فعّل JavaScript من إعدادات المتصفح ثم أعد فتح الصفحة.</p><h2 lang="en" dir="ltr">JavaScript is turned off</h2><p lang="en" dir="ltr">To play Maydan, enable JavaScript in your browser settings, then reopen this page.</p></section></main></noscript>
<div id="fatal" role="alert" hidden tabindex="-1"><section class="opening-card">
<b data-ar="ميدان" data-en="Maydan">ميدان</b><!--OPENING_RECOVERY_ART--><h1 data-ar="تعذّر بدء ميدان" data-en="Maydan couldn’t start">تعذّر بدء ميدان</h1><p data-ar="أعد المحاولة أو ارجع إلى الرئيسية." data-en="Try again or return to Home.">أعد المحاولة أو ارجع إلى الرئيسية.</p>
<div class="acts"><button type="button" id="fatal-reload" data-ar="إعادة المحاولة" data-en="Try again">إعادة المحاولة</button>
<button type="button" id="fatal-home" data-ar="العودة إلى الرئيسية" data-en="Return to Home">العودة إلى الرئيسية</button>
<small data-ar="قد تُمسح إعداداتك ومبارياتك المحلية. يبقى تسجيل دخولك محفوظًا." data-en="Local settings and saved games may be cleared. You’ll stay signed in.">قد تُمسح إعداداتك ومبارياتك المحلية. يبقى تسجيل دخولك محفوظًا.</small>
<button type="button" id="fatal-clear" class="danger" data-ar="مسح البيانات المحلية وإعادة التشغيل" data-en="Clear local data and restart">مسح البيانات المحلية وإعادة التشغيل</button></div>
<details><summary data-ar="تفاصيل الخطأ" data-en="Error details">تفاصيل الخطأ</summary><pre id="fatal-detail" dir="auto"></pre></details></section></div>
